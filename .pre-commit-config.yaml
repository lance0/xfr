default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|.*\.rs)$'
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-test
        name: cargo test
        entry: cargo test --locked --all-features
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|.*\.rs)$'
        pass_filenames: false
        stages: [pre-push]
