name: Docs

# ci.yml ignores Markdown-only changes; this keeps the typos check on them.
on:
  push:
    branches: [master, main]
    paths: ['**/*.md', 'docs/**']
  pull_request:
    paths: ['**/*.md', 'docs/**']

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.50.2
