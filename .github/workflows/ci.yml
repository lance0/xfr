name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

# Cancel superseded runs on a branch/PR, but never on master — a release-prep
# push must not be killed by a follow-up commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: --all-features
          - os: ubuntu-latest
            features: --no-default-features
          - os: macos-latest
            features: --all-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked ${{ matrix.features }}

  systemd-credentials:
    name: Systemd PSK credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ACL tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y acl
      - name: Build client and server
        run: cargo build --locked
      - name: Verify DynamicUser credentials and unsafe-file controls
        run: ./scripts/test-systemd-credentials.sh target/debug/xfr

  clippy:
    name: Clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        features: [--all-features, --no-default-features]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked ${{ matrix.features }} --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  doc:
    name: Doc (deny rustdoc warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  windows-check:
    name: Windows tests and Clippy
    runs-on: windows-latest
    # Informational until native Windows support is a priority: known
    # failures (LAN-2296, LAN-2299) and Windows timing flakes stay visible
    # without turning master red.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # Compile the tests too (--no-run) so a dependency MSRV bump or a test
      # using an API newer than 1.88 fails here, not only non-test code.
      - name: Build + compile tests on MSRV
        run: cargo test --all-features --no-run --locked

  cargo-deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.30
        with:
          tool: cargo-deny@0.19.8
      # Advisories are deliberately excluded — audit.yml owns cargo-audit and
      # two advisory gates would double the noise. Policy lives in deny.toml.
      - name: Check licenses / bans / sources
        run: cargo deny check licenses bans sources

  push-gateway:
    name: Pushgateway + vmagent ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build client and server
        run: cargo build --locked
      - name: Start metrics backends
        run: |
          docker run -d --name xfr-pushgateway --network host prom/pushgateway:v1.11.4 --web.listen-address=127.0.0.1:19091
          docker run -d --name xfr-victoriametrics --network host victoriametrics/victoria-metrics:v1.155.0 -httpListenAddr=127.0.0.1:18428
          docker run -d --name xfr-vmagent --network host victoriametrics/vmagent:v1.155.0 -httpListenAddr=127.0.0.1:18429 -remoteWrite.url=http://127.0.0.1:18428/api/v1/write -remoteWrite.flushInterval=1s
          for endpoint in 19091/-/healthy 18428/health 18429/health; do
            curl --fail --retry 15 --retry-delay 1 --retry-connrefused "http://127.0.0.1:$endpoint"
          done
      - name: Verify client and server samples in both backends
        run: python3 scripts/test-push-gateway.py target/debug/xfr http://127.0.0.1:19091 http://127.0.0.1:18428 http://127.0.0.1:18429/api/v1/import/prometheus
      - name: Backend logs
        if: failure()
        run: |
          docker logs xfr-pushgateway
          docker logs xfr-victoriametrics
          docker logs xfr-vmagent
      - name: Stop metrics backends
        if: always()
        run: docker rm -f xfr-pushgateway xfr-vmagent xfr-victoriametrics

  # Build every shippable release target on each PR (debug, no packaging) with
  # the same toolchains as release.yml, so a target-specific build/link failure
  # is caught before tag. zigbuild covers the Linux gnu/musl targets (Zig bundles
  # musl and pins a low glibc floor) — it replaces cross 0.2.5, whose stale images
  # failed build scripts under modern Rust (glibc 2.28+ symbol errors). Android
  # stays on cross (from git main, current glibc); macOS builds natively.
  cross-smoke:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            triple: x86_64-unknown-linux-musl
            os: ubuntu-latest
            tool: zigbuild
          - target: aarch64-unknown-linux-gnu
            triple: aarch64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            tool: zigbuild
          - target: aarch64-unknown-linux-musl
            triple: aarch64-unknown-linux-musl
            os: ubuntu-latest
            tool: zigbuild
          - target: aarch64-linux-android
            triple: aarch64-linux-android
            os: ubuntu-latest
            tool: cross
          - target: aarch64-apple-darwin
            triple: aarch64-apple-darwin
            os: macos-latest
            tool: native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Zig
        if: matrix.tool == 'zigbuild'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        run: cargo install cargo-zigbuild --version 0.23.0 --locked
      - name: Install cross (pinned main commit)
        if: matrix.tool == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 64b5bb4d --locked
      - name: Build (zigbuild)
        if: matrix.tool == 'zigbuild'
        run: cargo zigbuild --target ${{ matrix.triple }} --features prometheus --locked
      - name: Build (cross)
        if: matrix.tool == 'cross'
        run: cross build --target ${{ matrix.triple }} --features prometheus --locked
      - name: Build (native)
        if: matrix.tool == 'native'
        run: cargo build --target ${{ matrix.triple }} --features prometheus --locked
      # ABI check on the zigbuild targets: glibc floor (2.17) for gnu, static
      # for musl. Guards against a build that succeeds but links the wrong ABI.
      - name: Verify binary ABI
        if: matrix.tool == 'zigbuild'
        run: bash scripts/verify-target-binary.sh "${{ matrix.target }}" "${{ matrix.triple }}" debug

  mptcp:
    name: MPTCP (requires kernel MPTCP + netem)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run MPTCP namespace tests
        # The script emits a ::warning:: annotation and exits 0 when MPTCP or
        # netem is unavailable, making the skip visible in the PR check UI
        # without failing the job (LAN-174).
        run: sudo ./test-mptcp-ns.sh --ci

  control-channel-skew:
    name: Control-channel skew (#70 regression)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Verify TCP_NODELAY on control channel under saturated link
        run: sudo ./test-control-channel-skew.sh

  mtu-probe:
    name: 'UDP MTU + link-local regressions (#64, #213 netns)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Probe through a constrained middle hop
        run: sudo ./test-mtu-probe-ns.sh --ci
      - name: Verify configurable UDP payloads on a 1420-byte MTU path
        run: sudo ./test-udp-payload-ns.sh
      - name: Verify UDP reordering is not reported as loss
        run: sudo ./test-udp-reorder-ns.sh
      - name: Verify IPv6 link-local hosts with zone IDs
        run: sudo ./test-link-local-ns.sh
      - name: Verify UDP replies leave from the address the client targeted
        run: sudo ./test-udp-source-addr-ns.sh
